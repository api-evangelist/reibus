name: Reibus
description: Reibus is a technology-enabled B2B platform for the industrial metals
  industry, originally a digital marketplace for buying and selling steel and other
  metals and now focused on open-deck freight logistics for shipping steel and industrial
  metals. Operating as Reibus Logistics, the company connects shippers with a vast
  network of international and domestic carriers across flatbed, dry van, and drayage
  modes, offering instant quoting, shipment visibility, and cross-border logistics
  in the US, Canada, and Mexico. Founded by CEO John Blount, Reibus operates in 7
  countries, does business in 25+ countries, and is backed by Canaan Partners,
  Initialized Capital, and the SoftBank Vision Fund. As of this profile the company
  publishes no public developer API, SDK, or developer portal.
